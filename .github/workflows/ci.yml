name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - name: dist/ is up to date
        run: npm run build && git diff --exit-code -- dist
      - name: Smoke test (HTML + PDF renders, fit, glyphs, PDF text)
        run: npm run smoke
